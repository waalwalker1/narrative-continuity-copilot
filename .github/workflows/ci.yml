name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra cloud
          npm ci
      - name: Ruff Check & Format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Python Typecheck (mypy)
        run: |
          uv run mypy src apps/api tests
      - name: Frontend Typecheck
        run: |
          npm run typecheck

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Tests with Coverage
        run: |
          PYTHONPATH=. uv run pytest --cov=narrative_copilot --cov-report=term-missing --cov-report=xml tests/unit tests/property

  retrieval-integration:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: elasticsearch:8.14.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev --extra cloud
      - name: Run Integration Tests
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          PYTHONPATH=. uv run pytest tests/integration

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Bandit Security Scan
        run: |
          uv run bandit -r src apps/api -ll
      - name: Red-Team Prompt Injection Suite
        run: |
          PYTHONPATH=. uv run python -c "import asyncio; from evals.runners.injection_runner import InjectionBenchmarkRunner; r = InjectionBenchmarkRunner(); res = asyncio.run(r.run_benchmark()); assert res['failed'] == 0, f'Prompt injection failures: {res}'"

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Frontend Unit Tests
        run: npm test
      - name: Build Web Application
        run: npm run build

  benchmark-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Evaluation Suite
        run: |
          PYTHONPATH=. uv run python evals/runners/run_all.py
      - name: Check Metric Synchronization
        run: |
          PYTHONPATH=. uv run python scripts/sync_public_metrics.py --check

  release-gate:
    needs:
      - lint-typecheck
      - backend-tests
      - retrieval-integration
      - security-tests
      - frontend-quality
      - benchmark-and-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Release Gate Verdict
        run: echo "All release gates passed successfully!"
