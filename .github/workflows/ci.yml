name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra cloud
          npm ci
      - name: Ruff Check & Format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Python Typecheck (mypy)
        run: |
          uv run mypy src apps/api tests
      - name: Frontend Lint & Typecheck
        run: |
          npm run typecheck

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Unit, Property & Integration Tests with Coverage
        env:
          USE_DETERMINISTIC_EMBEDDINGS: 1
        run: |
          PYTHONPATH=src:apps:. uv run pytest --cov=narrative_copilot --cov-report=term-missing --cov-report=xml --cov-fail-under=75 tests/unit tests/property tests/integration

  retrieval-full-stack:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: elasticsearch:8.14.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev --extra cloud
      - name: Run Full-Stack Retrieval Integration Tests
        env:
          ELASTICSEARCH_URL: http://localhost:9200
          USE_DETERMINISTIC_EMBEDDINGS: 1
        run: |
          PYTHONPATH=src:apps:. uv run pytest tests/integration

  benchmark-full-stack:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: elasticsearch:8.14.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Master Benchmark Suite
        env:
          ELASTICSEARCH_URL: http://localhost:9200
          USE_DETERMINISTIC_EMBEDDINGS: 1
        run: |
          PYTHONPATH=src:apps:. uv run python evals/runners/run_all.py
      - name: Check Metric Synchronization
        run: |
          PYTHONPATH=src:apps:. uv run python scripts/sync_public_metrics.py --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Bandit Security Scan
        run: |
          uv run bandit -r src apps/api -ll
      - name: Red-Team Prompt Injection Suite
        run: |
          PYTHONPATH=src:apps:. uv run python -c "import asyncio; from evals.runners.injection_runner import InjectionBenchmarkRunner; r = InjectionBenchmarkRunner(); res = asyncio.run(r.run_benchmark()); assert res['failed'] == 0, f'Prompt injection failures: {res}'"

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Frontend Unit Tests
        run: npm test
      - name: Build Web Application
        run: npm run build

  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra cloud
          npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E Tests
        env:
          USE_DETERMINISTIC_EMBEDDINGS: 1
          PYTHONPATH: src:apps:.
        run: npm run test:e2e

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Validate Compose Stack
        run: |
          docker compose config
          docker compose build

  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Check Untracked Spec Files
        run: |
          ! git ls-files | grep -E "(BUILD_SPEC|FINAL_.*RELEASE|eval_output\.json)"
      - name: Check Public Metric Sync
        run: |
          PYTHONPATH=src:apps:. uv run python scripts/sync_public_metrics.py --check

  release-gate:
    needs:
      - lint-typecheck
      - backend-tests
      - retrieval-full-stack
      - benchmark-full-stack
      - security
      - frontend-quality
      - playwright-e2e
      - docker-smoke
      - public-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Release Gate Verdict
        run: echo "All 10 mandatory release gates passed successfully!"
