[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narrative-continuity-copilot"
version = "0.1.0"
description = "Evidence-grounded story memory and continuity review for long-form fiction."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Narrative Continuity Copilot Contributors" }
]
keywords = [
    "narrative-continuity",
    "story-memory",
    "llm",
    "retrieval-augmented-generation",
    "elasticsearch",
    "writing-tools",
    "fiction-editing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "elasticsearch>=8.14.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "python-docx>=1.1.2",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-prometheus>=0.46b0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
cloud = [
    "google-genai>=0.1.1",
    "google-cloud-aiplatform>=1.60.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.110.0",
    "ruff>=0.5.5",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "detect-secrets>=1.5.0",
    "types-requests>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/narrative_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "UP042", "RUF012", "B904", "B008", "RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["narrative_copilot"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "docx.*",
    "docx",
    "elasticsearch.*",
    "google.genai.*",
    "opentelemetry.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["assignment", "no-untyped-call"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=narrative_copilot --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "auto"
